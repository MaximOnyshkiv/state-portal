# Render Blueprint — New → Blueprint → select this repo.
services:
  - type: web
    name: state-portal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL     # Postgres (Neon / Render Postgres). Without it SQLite is used and data is lost on redeploy!
        sync: false
      - key: ADMIN_LOGIN      # first portal admin (created once on start)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO        # "0" = do not create [Приклад] demo data
        value: "0"
      - key: NOVA_AUTH_URL    # https URL of nova-auth on the game PC (Cloudflare Tunnel)
        sync: false
      - key: NOVA_AUTH_SECRET # same as AUTH_SECRET in nova-auth .env
        sync: false
      - key: AUTH_MODE        # nova = only game login (+ADMIN_LOGIN), both = game + local, local = no game login
        value: nova
